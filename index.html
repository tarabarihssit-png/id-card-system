<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Data Entry Form</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 15px; }
        .form-container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #003366; margin-bottom: 20px; font-size: 20px; }
        .section-title { background: #003366; color: #fff; padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 4px; margin-top: 20px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #333; }
        input[type="text"], input[type="date"], input[type="email"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input[type="file"] { width: 100%; padding: 6px; background: #f9f9f9; border: 1px dashed #003366; border-radius: 4px; font-size: 13px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-submit { width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-submit:hover { background: #218838; }
        .btn-export { width: 100%; background: #007bff; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .records-count { text-align: center; font-size: 13px; font-weight: bold; margin-top: 10px; color: #555; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Teacher ID Card Entry Form</h2>
    <form id="idCardForm">
        
        <!-- FRONT SIDE DETAILS -->
        <div class="section-title">FRONT SIDE DETAILS</div>
        
        <div class="form-group">
            <label>ID No. / Code (Unique Key)*</label>
            <!-- Default value "JNVM/" set here -->
            <input type="text" id="id_no" value="JNVM/" required>
        </div>

        <div class="form-group">
            <label>Teacher / Employee Name*</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label>Designation*</label>
            <input type="text" id="designation" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>PIS ID</label>
                <input type="text" id="pis_id">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="text" id="dob">
            </div>
        </div>

        <div class="form-group">
            <label>Father's Name</label>
            <input type="text" id="father_name">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Contact No.</label>
                <input type="text" id="contact_no">
            </div>
            <div class="form-group">
                <label>Valid Upto</label>
                <input type="text" id="valid_upto">
            </div>
        </div>

        <div class="form-group">
            <label>Teacher Photo (Camera/Gallery)*</label>
            <input type="file" id="sign_file" accept="image/*" capture="environment" required>
        </div>

        <!-- BACK SIDE DETAILS -->
        <div class="section-title">BACK SIDE DETAILS</div>

        <div class="grid-2">
            <div class="form-group">
                <label>Blood Group</label>
                <input type="text" id="blood_group">
            </div>
            <div class="form-group">
                <label>OASIS ID</label>
                <input type="text" id="oasis_id">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>(UDISE+ID)</label>
                <input type="text" id="udise_id">
            </div>
            <div class="form-group">
                <label>AADHAR NO</label>
                <input type="text" id="aadhar_no">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>DOJ in Samiti</label>
                <input type="text" id="doj_samiti">
            </div>
            <div class="form-group">
                <label>DOJ in School</label>
                <input type="text" id="doj_school">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" id="address">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>P.O.</label>
                <input type="text" id="po">
            </div>
            <div class="form-group">
                <label>Dist.</label>
                <input type="text" id="dist">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>State</label>
                <input type="text" id="state">
            </div>
            <div class="form-group">
                <label>Pin</label>
                <input type="text" id="pin">
            </div>
        </div>

        <div class="form-group">
            <label>E-mail ID</label>
            <input type="email" id="email">
        </div>

        <div class="form-group">
            <label>Identification Mark</label>
            <input type="text" id="id_mark">
        </div>

        <div class="form-group">
            <label>Employee Signature (Upload/Camera)*</label>
            <input type="file" id="sign_file" accept="image/*" capture="environment" required>
        </div>

        <button type="submit" class="btn-submit">SAVE ENTRY & DOWNLOAD MEDIA</button>
    </form>

    <div class="records-count">Total Saved Entries: <span id="recordCount">0</span></div>
    <button class="btn-export" onclick="exportToCSV()">EXPORT MASTER EXCEL (CSV)</button>
</div>

<script>
    let entries = JSON.parse(localStorage.getItem('id_entries') || '[]');
    document.getElementById('recordCount').innerText = entries.length;

    // Helper function to sanitize ID for file naming (removes / and spaces and replaces with _)
    function sanitizeID(str) {
        return str.replace(/[^a-zA-Z0-9]/g, "_");
    }

    // Helper to download files
    function downloadFile(file, fileName) {
        const url = URL.createObjectURL(file);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    document.getElementById('idCardForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const idNoRaw = document.getElementById('id_no').value.trim();
        const cleanID = sanitizeID(idNoRaw); // JNVM/201 ban jayega JNVM_201

        const photoFile = document.getElementById('photo_file').files[0];
        const signFile = document.getElementById('sign_file').files[0];

        const photoName = cleanID + "_photo.jpg";
        const signName = cleanID + "_sign.jpg";

        if (photoFile) downloadFile(photoFile, photoName);
        if (signFile) downloadFile(signFile, signName);

        const record = {
            ID_No: idNoRaw,
            Name: document.getElementById('name').value,
            Designation: document.getElementById('designation').value,
            PIS_ID: document.getElementById('pis_id').value,
            DOB: document.getElementById('dob').value,
            Father_Name: document.getElementById('father_name').value,
            Contact_No: document.getElementById('contact_no').value,
            Valid_Upto: document.getElementById('valid_upto').value,
            Photo_Filename: photoName,
            Blood_Group: document.getElementById('blood_group').value,
            OASIS_ID: document.getElementById('oasis_id').value,
            UDISE_ID: document.getElementById('udise_id').value,
            Aadhar_No: document.getElementById('aadhar_no').value,
            DOJ_Samiti: document.getElementById('doj_samiti').value,
            DOJ_School: document.getElementById('doj_school').value,
            Address: document.getElementById('address').value,
            PO: document.getElementById('po').value,
            Dist: document.getElementById('dist').value,
            State: document.getElementById('state').value,
            Pin: document.getElementById('pin').value,
            Email: document.getElementById('email').value,
            ID_Mark: document.getElementById('id_mark').value,
            Sign_Filename: signName
        };

        entries.push(record);
        localStorage.setItem('id_entries', JSON.stringify(entries));
        document.getElementById('recordCount').innerText = entries.length;

        alert('Data and files saved for ID: ' + idNoRaw);
        
        // Form ko reset karna aur ID ko wapas JNVM/ set karna
        document.getElementById('idCardForm').reset();
        document.getElementById('id_no').value = "JNVM/";
    });

    function exportToCSV() {
        if (entries.length === 0) {
            alert('Koi record save nahi hua hai abhi tak!');
            return;
        }

        const headers = Object.keys(entries[0]).join(',') + '\n';
        const rows = entries.map(row => {
            return Object.values(row).map(val => `"${String(val).replace(/"/g, '""')}"`).join(',');
        }).join('\n');

        const csvContent = "data:text/csv;charset=utf-8," + encodeURIComponent(headers + rows);
        const a = document.createElement('a');
        a.href = csvContent;
        a.download = 'ID_Card_Master_Data.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
